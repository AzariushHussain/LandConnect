name: landconnect

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build: ./backend
    image: landconnect-api:local
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Run scripts/init_env.py first}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: landconnect-api:local
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads:
