name: landconnect

services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Run scripts/init_env.py first}: ${LIVEKIT_API_SECRET:?Run scripts/init_env.py first}"
      NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - ./infra/livekit/livekit.local.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7880:7880/tcp"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7881:7881/tcp"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7882:7882/udp"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:3478:3478/udp"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:30000-30049:30000-30049/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build: ./backend
    image: landconnect-api:local
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Run scripts/init_env.py first}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: landconnect-api:local
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Run scripts/init_env.py first}
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_INTERNAL_URL: http://livekit:7880
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads:
